<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Здай вчасно!</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="app">
  <aside class="left-section">
    <h2 class="left-title">Здай<span class="title-highlight">Вчасно</span></h2>

    <div class="sort-parameters">
      <button class="parameter-btn active">
        <span class="sort-parameter">Усі роботи</span>
        <span class="parameter-value">6</span>
      </button>

      <button class="parameter-btn">
        <span class="sort-parameter">Сьогодні</span>
        <span class="parameter-value">0</span>
      </button>

      <button class="parameter-btn">
        <span class="sort-parameter">Цього тижня</span>
        <span class="parameter-value">3</span>
      </button>

      <button class="parameter-btn">
        <span class="sort-parameter">Прострочені</span>
        <span class="parameter-value">1</span>
      </button>

      <button class="parameter-btn">
        <span class="sort-parameter">Виконані</span>
        <span class="parameter-value">2</span>
      </button>
    </div>

    <div class="subjects">
      <h4 class="subjects-title">Предмети</h4>
      <button class="subject-btn">
        <span class="subject-name">Дискретна математика</span>
        <span class="subject-value">2</span>
      </button>

      <button class="subject-btn active">
        <span class="subject-name ">Алгоритмізація та програмування</span>
        <span class="subject-value">1</span>
      </button>

      <button class="subject-btn">
        <span class="subject-name">Фізика</span>
        <span class="subject-value">1</span>
      </button>

      <button class="subject-btn">
        <span class="subject-name">Вища математика</span>
        <span class="subject-value">1</span>
      </button>

      <button class="subject-btn">
        <span class="subject-name">Історія</span>
        <span class="subject-value">1</span>
      </button>

      <button class="subject-btn">
        <span class="subject-name">Англійська мова</span>
        <span class="subject-value">0</span>
      </button>
    </div>
  </aside>

  <section class="main">
  <header class="header">
    <div class="first-header">
      <span class="header-text">
        <h1 class="header-title">Мої роботи</h1>
        <h4 class="header-subtitle">Четвер, 8 жовтня · найближчий дедлайн через 2 дні</h4>
      </span>

      <div class="header-actions">
        <input class="search-input" type="text" placeholder="Пошук роботи">
        <button class="add-btn">+ Нова робота</button>
      </div>
    </div>

    <div class="second-header">
      <span class="item">
        <h5 class="item-title">Усього</h5>
        <h2 class="item-value d">6</h2>
      </span>

      <span class="item">
        <h5 class="item-title">В процесі</h5>
        <h2 class="item-value b">3</h2>
      </span>

      <span class="item">
        <h5 class="item-title">Виконано</h5>
        <h2 class="item-value g">2</h2>
      </span>

      <span class="item">
        <h5 class="item-title">Прострочені</h5>
        <h2 class="item-value r">1</h2>
      </span>
    </div>
    
    <div class="tasks-row">
      <span class="tasks-types">
        <button class="task-btn active-task">Усі</button>
        <button class="task-btn">Лабораторні</button>
        <button class="task-btn">Практичні</button>
        <button class="task-btn">Виконанні</button>
        <button class="task-btn">Не виконанні</button>
      </span>

      <span class="tasks-sort">
        <h4 class="sort-title">Сортувати за:</h4>

      </span>
    </div>
  </header>
</section>
</body>
</html>
